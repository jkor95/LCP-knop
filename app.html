<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d36"><link rel="manifest" href="./manifest.webmanifest"><title>LCP Knop</title>
<style>body{font:16px system-ui;margin:0;background:#f2f6f4;color:#173d35}main{max-width:620px;margin:auto;padding:22px}h1{margin-bottom:4px}.panel,.call{background:white;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 2px 10px #102f2912}input,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:10px;font:inherit}input{border:1px solid #c5d3ce}button{border:0;background:#16704e;color:white;font-weight:700}button:disabled{opacity:.5}.light{background:#e1f1e9;color:#165b41}.muted{color:#667b73;font-size:14px}.error{color:#a52828}#app{display:none}.call button{width:auto}.call{border-left:5px solid #1c8c62}</style></head>
<body><main><h1>🔔 LCP Knop</h1><div class="muted">Dalton VWO · oproepsysteem</div><div id="login" class="panel"><h2>Inloggen</h2><input id="email" type="email" placeholder="E-mailadres" autocomplete="username"><input id="password" type="password" placeholder="Wachtwoord" autocomplete="current-password"><button id="signin">Inloggen</button></div><div id="app"><div class="panel"><h2>Oproepen</h2><p id="connection" class="muted">Verbinding maken…</p><button id="test">🔔 Testoproep</button><button id="permission" class="light">Meldingen toestaan</button><p class="muted">Windows-meldingen werken zolang deze webapp geopend blijft, ook op een achtergrondtabblad. Meldingen bij gesloten browser of vergrendeld scherm worden nog ontwikkeld.</p></div><div class="panel"><h2>Laatste oproepen</h2><button class="light" id="refresh">Verversen</button><div id="calls"></div></div><button class="light" id="logout">Uitloggen</button></div><p id="error" class="error" role="alert"></p></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://jrlcofhpxvnlqzirjdbd.supabase.co','sb_publishable_l-rXo1gmk9dGQ2QogsUexw_bAZfd84R'),el=id=>document.getElementById(id);let user,role,channel,lastSeen=null,pollTimer=null;
async function notifyCall(c){if(!('Notification'in window)||Notification.permission!=='granted')return;try{if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.ready;await reg.showNotification('LCP oproep',{body:c.message||'Er staat iemand bij het LCP',tag:'lcp-'+c.id,icon:'./icon-192.png'});}else new Notification('LCP oproep',{body:c.message||'Nieuwe oproep'});}catch(e){console.warn('Melding niet getoond',e);}}
async function checkNew(){if(!user)return;const{data,error}=await db.from('lcp_calls').select('id,message,created_at').order('created_at',{ascending:false}).limit(1);if(error||!data?.length)return;const newest=data[0];if(lastSeen===null){lastSeen=newest.id;return;}if(newest.id!==lastSeen){lastSeen=newest.id;await notifyCall(newest);await load();}}

function fail(error){el('error').textContent=error?.message||String(error)}
async function load(){const{data,error}=await db.from('lcp_calls').select('id,source,message,created_at,acknowledged_at').order('created_at',{ascending:false}).limit(40);if(error)return fail(error);el('calls').replaceChildren(...data.map(c=>{const box=document.createElement('div');box.className='call';const h=document.createElement('b');h.textContent=c.message;const p=document.createElement('p');p.className='muted';p.textContent=new Date(c.created_at).toLocaleString('nl-NL')+' · '+c.source+(c.acknowledged_at?' · Afgehandeld':' · Open');box.append(h,p);if(!c.acknowledged_at&&role!=='viewer'){const b=document.createElement('button');b.textContent='Afhandelen';b.onclick=async()=>{const{error}=await db.from('lcp_calls').update({acknowledged_at:new Date().toISOString(),acknowledged_by:user.id}).eq('id',c.id).is('acknowledged_at',null);if(error)fail(error);await load()};box.append(b)}return box}))}
async function start(){const{data:{user:u}}=await db.auth.getUser();user=u;if(!u){el('login').style.display='block';el('app').style.display='none';return}const{data:m,error}=await db.from('lcp_members').select('role').eq('user_id',u.id).single();if(error||!m){fail('Dit account is nog niet toegelaten tot LCP Knop.');await db.auth.signOut();return}role=m.role;el('login').style.display='none';el('app').style.display='block';el('test').disabled=role==='viewer';await load();await checkNew();if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(checkNew,8000);if(channel)await db.removeChannel(channel);channel=db.channel('lcp-updates').on('postgres_changes',{event:'*',schema:'public',table:'lcp_calls'},async p=>{if(p.eventType==='INSERT')await checkNew();await load()}).subscribe(s=>el('connection').textContent=s==='SUBSCRIBED'?'Live verbonden':s)}
el('signin').onclick=async()=>{el('error').textContent='';const{error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)fail(error);else await start()};
el('test').onclick=async()=>{el('test').disabled=true;const{error}=await db.from('lcp_calls').insert({source:'test',message:'LCP testoproep',created_by:user.id});if(error)fail(error);else {await checkNew();await load();}el('test').disabled=role==='viewer'};
el('permission').onclick=async()=>{if(!('Notification'in window))return fail('Meldingen niet beschikbaar op dit apparaat.');{const state=Notification.permission==='granted'?'granted':await Notification.requestPermission();el('connection').textContent=state==='granted'?'Meldingen toegestaan ✓':'Meldingen: '+state;if(state==='granted'){el('permission').textContent='🔔 Stuur testmelding';el('permission').onclick=()=>notifyCall({id:'permission-test-'+Date.now(),message:'Dit is een testmelding van LCP Knop'});}}};
el('refresh').onclick=load;el('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});start();
</script></body></html>
