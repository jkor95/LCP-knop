name: LCP Windows-update controleren
on:
  push:
    paths:
      - 'windows/**'
      - 'tests/test_windows_update.ps1'
      - 'tests/test_windows_start_report.ps1'
      - 'scripts/build_sensor_update.py'
      - '.github/workflows/lcp-windows-update.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests==2.32.3 paho-mqtt==2.1.0
      - name: Controleer update en automatisch herstel op Windows
        shell: powershell
        run: .\tests\test_windows_update.ps1
      - name: Controleer update ook met PowerShell 7
        shell: pwsh
        run: .\tests\test_windows_update.ps1
      - name: Controleer leesverslag met PowerShell 5
        shell: powershell
        run: .\tests\test_windows_start_report.ps1
      - name: Controleer leesverslag met PowerShell 7
        shell: pwsh
        run: .\tests\test_windows_start_report.ps1
