name: LCP deursensoren activeren
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lcp-supabase-controle
  cancel-in-progress: false
jobs:
  deursensoren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==46.0.3
      - name: Controleer de veilige beheerroute
        run: python -m unittest discover -s tests -p test_supabase_inspect.py -v
      - name: Activeer uitsluitend sensortabeluitbreiding en vier standaardinstellingen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/supabase_sensors.py
      - name: Bewaar het versleutelde activeringsrapport of foutdiagnose
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BASE_SHA: ${{ github.sha }}
        run: |
          if [ -f "$RUNNER_TEMP/lcp-inspectie.enc.json" ]; then
            python scripts/publish_inspection.py
          fi
