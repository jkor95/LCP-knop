name: LCP Supabase activeren
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lcp-supabase-controle
  cancel-in-progress: false
jobs:
  activeren:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: python -m pip install cryptography==46.0.3
      - name: Controleer de veilige activeringsroute
        run: |
          python -m unittest discover -s tests -p test_supabase_inspect.py -v
          deno check supabase/functions/lcp-push-test/index.ts supabase/functions/lcp-push-dispatch/index.ts
      - name: Behoud sleutels en activeer aanvullende database-instellingen
        run: python scripts/supabase_apply.py prepare
      - name: Publiceer de persoonlijke testfunctie
        run: supabase functions deploy lcp-push-test --project-ref jrlcofhpxvnlqzirjdbd --use-api
      - name: Werk uitsluitend de bestaande pushweergave bij
        run: supabase functions deploy lcp-push-dispatch --project-ref jrlcofhpxvnlqzirjdbd --use-api
      - name: Controleer productierechten zonder blijvende testwijzigingen
        run: python scripts/supabase_apply.py verify
      - name: Persoonlijke test uitsluitend naar de unieke beheerder
        run: deno run --allow-env --allow-read --allow-write --allow-net scripts/supabase_own_push_test.ts
      - name: Bewaar het versleutelde activeringsrapport
        run: python scripts/supabase_apply.py report
      - name: Maak het rapport veilig bereikbaar
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BASE_SHA: ${{ github.sha }}
        run: python scripts/publish_inspection.py
      - name: Bewaar een versleutelde foutdiagnose als de beheer-API weigert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BASE_SHA: ${{ github.sha }}
        run: |
          if [ -f "$RUNNER_TEMP/lcp-inspectie.enc.json" ]; then
            python scripts/publish_inspection.py
          fi
      - name: Ruim tijdelijke credentialbestanden op
        if: always()
        run: rm -f "$RUNNER_TEMP/lcp-deployment-private.json" "$RUNNER_TEMP/lcp-own-push-test.json"
