name: LCP pushmeldingen
on:
  push:
    paths:
      - '*.html'
      - '*.js'
      - '*.webmanifest'
      - '*.png'
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/lcp-push.yml'
  pull_request:
  workflow_dispatch:
jobs:
  push-en-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/push.test.mjs
      - name: Installeer lokale PostgreSQL-testomgeving
        run: npm install --prefix "$RUNNER_TEMP/lcp-db" --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Controleer migratie en toegangsregels
        env:
          LCP_PGLITE_MODULE: ${{ runner.temp }}/lcp-db/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test tests/push-database.test.mjs tests/call-history-database.test.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Instellingen, logo, persoonlijke test en serviceworker
        env:
          LCP_BROWSER_TESTS: '1'
        run: python -m unittest discover -s tests -p test_push_ui.py -v
